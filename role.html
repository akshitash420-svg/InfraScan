<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        InfraSense | Select Role
    </title>

    <link
        rel="stylesheet"
        href="/static/style.css">

</head>


<body>


    <main class="role-page">


        <div class="role-container">


            <div class="brand">

                <div class="brand-logo">
                    IS
                </div>

                <span>
                    InfraScan
                </span>

            </div>



            <div class="role-heading">

                <p class="small-tag">
                    WELCOME BACK
                </p>

                <h1>
                    Continue as
                </h1>

                <p>
                    Select your role to access the InfraScan portal.
                </p>

            </div>



            <div class="role-cards">


                <div
                    class="role-card"
                    onclick="openStudentLogin()">

                    <div class="role-icon student-icon">
                        👩‍🎓
                    </div>

                    <div class="role-info">

                        <h2>
                            Student / CR
                        </h2>

                        <p>
                            Report classroom issues and track
                            their resolution.
                        </p>

                        <span class="role-link">
                            Continue →
                        </span>

                    </div>

                </div>



                <div
                    class="role-card"
                    onclick="openAdminLogin()">

                    <div class="role-icon admin-icon">
                        🧑‍💼
                    </div>

                    <div class="role-info">

                        <h2>
                            Admin
                        </h2>

                        <p>
                            Manage complaints and monitor
                            issue resolution.
                        </p>

                        <span class="role-link">
                            Continue →
                        </span>

                    </div>

                </div>


            </div>



            <p class="secure-text">
                🔒 Secure role-based access
            </p>


        </div>

    </main>


    <script src="/static/script.js"></script>

</body>

</html>
