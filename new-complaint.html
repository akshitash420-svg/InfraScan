<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Report Issue | InfraScan</title>

    <link
        rel="stylesheet"
        href="./static/style.css">

</head>


<body class="report-page">


    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav class="report-nav">

        <div class="report-brand">

            <div class="report-logo">
                IS
            </div>

            <span>
                InfraScan
            </span>

        </div>


        <button
            type="button"
            class="back-dashboard"
            onclick="goBack()">

            ← Dashboard

        </button>

    </nav>



    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="report-container">


        <div class="report-heading">

            <span class="report-label">
                NEW REPORT
            </span>

            <h1>
                Report a Classroom Issue
            </h1>

            <p>
                Tell us what's wrong and help us get it fixed faster.
            </p>

        </div>



        <!-- =========================
             REPORT FORM
        ========================== -->

        <section class="report-card">


            <form id="issueForm">


                <!-- Classroom -->

                <div class="form-group">

                    <label for="classroom">
                        Classroom / Room
                    </label>

                    <input
                        type="text"
                        id="classroom"
                        name="classroom"
                        placeholder="e.g. Block A - Room 204"
                        required>

                </div>



                <!-- Issue Type -->

                <div class="form-group">

                    <label for="issueType">
                        Issue Type
                    </label>

                    <select
                        id="issueType"
                        name="issueType"
                        required>

                        <option value="">
                            Select issue type
                        </option>

                        <option value="Electricity">
                            Electricity / Power
                        </option>

                        <option value="Fan">
                            Fan / AC
                        </option>

                        <option value="Light">
                            Light
                        </option>

                        <option value="Furniture">
                            Furniture / Desk
                        </option>

                        <option value="Projector">
                            Projector / Display
                        </option>

                        <option value="Network">
                            Internet / Network
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>



                <!-- Description -->

                <div class="form-group">

                    <label for="description">
                        Describe the Issue
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="5"
                        placeholder="Explain what is not working..."
                        required></textarea>

                </div>



                <!-- Photo -->

                <div class="form-group">

                    <label for="issuePhoto">
                        Photo of the Issue
                    </label>


                    <div class="upload-box">

                        <input
                            type="file"
                            id="issuePhoto"
                            name="issuePhoto"
                            accept="image/png,image/jpeg,image/jpg"
                            onchange="showFileName()">


                        <div class="upload-content">

                            <div class="upload-icon">
                                ↑
                            </div>

                            <strong>
                                Upload a photo
                            </strong>

                            <span>
                                PNG, JPG or JPEG
                            </span>

                            <small id="fileName">
                                No file selected
                            </small>

                        </div>

                    </div>

                </div>



                <!-- Submit -->

                <button
                    type="submit"
                    class="submit-issue-btn">

                    Submit Issue
                    <span>→</span>

                </button>


                <p class="form-note">

                    Your report will be sent to the Admin
                    for resolution.

                </p>


            </form>

        </section>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="./static/script.js"></script>

</body>

</html>
